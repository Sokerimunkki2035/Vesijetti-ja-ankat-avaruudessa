<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avaruusvesijetti & Kumiankat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            touch-action: none;
        }
        canvas {
            background-color: #0b0b1e;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            width: 100%;
            height: 100%;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 22px;
            text-shadow: 0 0 5px #00ffff;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Ankat: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        const scoreVal = document.getElementById("scoreVal");

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            targetX: canvas.width / 2,
            targetY: canvas.height - 150,
            speed: 0.2
        };

        const ducks = [];
        const stars = [];
        const waterParticles = [];

        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width - canvas.width / 2,
                y: Math.random() * canvas.height - canvas.height / 2,
                z: Math.random() * canvas.width,
                size: Math.random() * 2 + 1
            });
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches[0].clientX;
            const clientY = e.touches[0].clientY;
            
            player.targetX = clientX - rect.left;
            player.targetY = clientY - rect.top;
        }

        window.addEventListener("touchmove", handleTouch, { passive: false });
        window.addEventListener("touchstart", handleTouch, { passive: false });

        // Varmistetaan toimivuus myös hiirellä testatessa
        window.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        function spawnDuck() {
            if (ducks.length < 6 && Math.random() < 0.04) {
                ducks.push({
                    x: (Math.random() - 0.5) * canvas.width * 0.8,
                    y: (Math.random() - 0.5) * canvas.height * 0.5,
                    z: canvas.width,
                    size: 25,
                    angle: Math.random() * 360,
                    spin: Math.random() * 4 - 2
                });
            }
        }

        function drawPlayer(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Vesijetin perävesi / ionisuihku
            waterParticles.forEach(p => {
                ctx.fillStyle = `rgba(0, 220, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vesijetin runko (virtaviivainen)
            ctx.fillStyle = "#ff007f"; // Menevä neon-magenta
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.bezierCurveTo(20, -10, 22, 25, 15, 35);
            ctx.lineTo(-15, 35);
            ctx.bezierCurveTo(-22, 25, -20, -10, 0, -35);
            ctx.closePath();
            ctx.fill();

            // Istuin
            ctx.fillStyle = "#111122";
            ctx.beginPath();
            ctx.ellipse(0, 5, 8, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ohjaustanko
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-12, -10);
            ctx.lineTo(12, -10);
            ctx.stroke();

            // Kuljettajan pleksi/tuulilasi
            ctx.fillStyle = "rgba(0, 255, 255, 0.4)";
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(8, -12);
            ctx.lineTo(-8, -12);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawDuck(duck, screenX, screenY, size) {
            if (size <= 0) return;
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(duck.angle * Math.PI / 180);

            // Ankan vartalo
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();

            // Ankan pää
            ctx.beginPath();
            ctx.arc(size * 0.6, -size * 0.6, size * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Nokka
            ctx.fillStyle = "#ff5500";
            ctx.beginPath();
            ctx.moveTo(size * 1.0, -size * 0.7);
            ctx.lineTo(size * 1.6, -0.6 * size);
            ctx.lineTo(size * 1.0, -size * 0.4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function update() {
            // Pehmeämpi seuranta sormeen
            player.x += (player.targetX - player.x) * player.speed;
            player.y += (player.targetY - player.y) * player.speed;

            // Rajat ruudulla
            if (player.x < 40) player.x = 40;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
            if (player.y < 100) player.y = 100;
            if (player.y > canvas.height - 60) player.y = canvas.height - 60;

            // Moottorin vesiroiskeet / ionivanana
            if (Math.random() < 0.7) {
                waterParticles.push({
                    x: (Math.random() * 10) - 5,
                    y: 35,
                    vx: (Math.random() * 2) - 1,
                    vy: Math.random() * 5 + 4,
                    size: Math.random() * 3 + 2,
                    alpha: 1
                });
            }

            for (let i = waterParticles.length - 1; i >= 0; i--) {
                waterParticles[i].y += waterParticles[i].vy;
                waterParticles[i].alpha -= 0.05;
                if (waterParticles[i].alpha <= 0) waterParticles.splice(i, 1);
            }

            // Tähtien liike (avaruusefekti)
            stars.forEach(star => {
                star.z -= 5;
                if (star.z <= 0) {
                    star.z = canvas.width;
                    star.x = Math.random() * canvas.width - canvas.width / 2;
                    star.y = Math.random() * canvas.height - canvas.height / 2;
                }
            });

            // Ankkojen liike ja törmäykset
            spawnDuck();
            for (let i = ducks.length - 1; i >= 0; i--) {
                let d = ducks[i];
                d.z -= 5;
                d.angle += d.spin;

                if (d.z <= 0) {
                    ducks.splice(i, 1);
                    continue;
                }

                let k = 400 / d.z;
                let screenX = d.x * k + canvas.width / 2;
                let screenY = d.y * k + canvas.height / 2;
                let currentSize = d.size * k;

                // Osuman tunnistus vesijettiin
                let dist = Math.hypot(screenX - player.x, screenY - player.y);
                if (d.z < 100 && dist < currentSize + 30) {
                    score++;
                    scoreVal.innerText = score;
                    ducks.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#07071c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Piirretään tähdet
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                let k = 300 / star.z;
                let px = star.x * k + canvas.width / 2;
                let py = star.y * k + canvas.height / 2;
                let s = star.size * k;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    ctx.fillRect(px, py, s, s);
                }
            });

            // Piirretään ankat
            ducks.forEach(d => {
                let k = 400 / d.z;
                let screenX = d.x * k + canvas.width / 2;
                let screenY = d.y * k + canvas.height / 2;
                let currentSize = d.size * k;
                
                drawDuck(d, screenX, screenY, currentSize);
            });

            // Piirretään vesijetti
            drawPlayer(player.x, player.y);
        }

        function loop() {
            update();
            draw(); istu = requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
