<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADHD Cosmic Click Quest: Last Z Attack</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            touch-action: none;
        }
        canvas {
            background-color: #0b0b1e;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffff;
            font-size: 18px;
            text-shadow: 0 0 5px #00ffff;
            pointer-events: none;
            z-index: 10;
        }
        #levelProgressContainer {
            width: 80%;
            height: 15px;
            background-color: #111;
            border: 2px solid #00ffff;
            position: absolute;
            top: 15px;
            left: 10%;
            border-radius: 10px;
            overflow: hidden;
            z-index: 11;
        }
        #levelProgressBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #00ffff);
            transition: width 0.1s linear;
        }
        #levelText {
            position: absolute;
            top: -5px;
            left: 10%;
            width: 80%;
            text-align: center;
            color: #ff007f;
            font-weight: bold;
            font-size: 14px;
            z-index: 12;
        }
    </style>
</head>
<body>

    <div id="levelProgressContainer">
        <div id="levelProgressBar"></div>
    </div>
    <div id="levelText">TASO <span id="levelVal">1</span></div>
    
    <div id="ui">
         <br>
         Pelastettu: <span id="rescuedVal">0</span> ankkas<br>
         Lelut murskattu: <span id="fidgetScoreVal">0</span><br>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Laajennetut äänet ADHD-mieltä tyydyttäviin klikkauksiin
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'duck_rescue') { // Hidas, onnistunut klik
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'nakki_bite') { // Haukkausääni
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'fidget_crush') { // ADHD klik-ääni
                osc.type = 'square';
                osc.frequency.setValueAtTime(Math.random()*100 + 400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'level_up') { // Taso läpi -ääni
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(800, now + 0.1);
                osc.frequency.setValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        let currentLevel = 1;
        let totalRescued = 0;
        let fidgetScore = 0;
        let levelProgress = 0;
        const levelUpThreshold = 100; // Pisteet tason noston käynnistämiseksi
        let isLevelUpChallengeActive = false;
        let levelUpChallengeProgress = 0;
        const requiredChallengeClicks = 5;
        let challengeStartTime = 0;
        let isDuckRescueMinigameActive = false;
        let minigameDuck = null;
        let minigameStartTime = 0;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            targetX: canvas.width / 2,
            targetY: canvas.height - 150,
            speed: 0.15,
            levelUpClicks: 0
        };

        const objects = []; 
        const stars = [];
        const waterParticles = [];
        const splashEffects = []; 
        const fidgetEnemies = []; // Total Battle tyyliset ADHD-lelut

        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width - canvas.width / 2,
                y: Math.random() * canvas.height - canvas.height / 2,
                z: Math.random() * canvas.width,
                size: Math.random() * 2 + 1
            });
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.touches[0].clientX - rect.left;
            player.targetY = e.touches[0].clientY - rect.top;

            if (isDuckRescueMinigameActive) {
                // Minipelissä kosketus pitää pitää ankan päällä
                let distToDuck = Math.hypot(player.targetX - minigameDuck.x, player.targetY - minigameDuck.y);
                if (distToDuck > 60) {
                    failMinigame();
                }
            } else if (isLevelUpChallengeActive) {
                // Tason haaste: Klikkauspainikkeen osuma
                let distToButton = Math.hypot(player.targetX - canvas.width / 2, player.targetY - canvas.height / 2);
                if (distToButton < 70) {
                    player.levelUpClicks++;
                    playSound('fidget_crush');
                    if (player.levelUpClicks >= requiredChallengeClicks) {
                        completeLevelUp();
                    }
                }
            }
        }

        window.addEventListener("touchmove", handleTouch, { passive: false });
        window.addEventListener("touchstart", handleTouch, { passive: false });
        // Ei tarvita hiirtä, oletetaan mobiili

        function spawnObjects() {
            if (isDuckRescueMinigameActive || isLevelUpChallengeActive) return;
            
            // Spawnataan ankoja ja makkaroita
            if (objects.length < 4 && Math.random() < 0.03) {
                let rand = Math.random();
                let type = 'duck';
                if (rand > 0.8) type = 'nakki'; // Nakki

                objects.push({
                    type: type,
                    x: (Math.random() - 0.5) * canvas.width * 0.7,
                    y: (Math.random() - 0.5) * canvas.height * 0.4,
                    z: canvas.width,
                    size: type === 'duck' ? 22 : 18,
                    angle: Math.random() * 360,
                    spin: Math.random() * 3 - 1.5
                });
            }

            // Spawnataan ADHD-fidget-vihollisia (Total Battle -tyyliin)
            if (fidgetEnemies.length < 5 + currentLevel * 2 && Math.random() < 0.05 + currentLevel * 0.01) {
                let xSpawn = Math.random() < 0.5 ? 50 : canvas.width - 50;
                let ySpawn = (Math.random() * canvas.height * 0.7) + 50;
                
                fidgetEnemies.push({
                    x: xSpawn,
                    y: ySpawn,
                    type: Math.random() < 0.5 ? 'napit' : 'rulla',
                    size: 25,
                    vx: (Math.random()*2 - 1) * (currentLevel * 0.2 + 1),
                    vy: (Math.random()*2 + 1) * (currentLevel * 0.2 + 1),
                    angle: Math.random() * 360,
                    spin: Math.random() * 2 - 1
                });
            }
        }

        function drawPlayer(x, y) {
            ctx.save();
            ctx.translate(x, y);

            waterParticles.forEach(p => {
                ctx.fillStyle = `rgba(0, 220, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vesijetin runko - ADHD Cosmic Look
            ctx.fillStyle = "#ff007f";
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.bezierCurveTo(20, -10, 22, 25, 15, 35);
            ctx.lineTo(-15, 35);
            ctx.bezierCurveTo(-22, 25, -20, -10, 0, -35);
            ctx.closePath();
            ctx.fill();

            // Istuin & ohjaustanko
            ctx.fillStyle = "#111122";
            ctx.beginPath();
            ctx.ellipse(0, 5, 8, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-12, -10);
            ctx.lineTo(12, -10);
            ctx.stroke();

            ctx.restore();
        }

        function drawObject(obj, x, y, size) {
            if (size <= 0) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(obj.angle * Math.PI / 180);

            if (obj.type === 'duck') {
                // Ankka
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff5500";
                ctx.beginPath();
                ctx.moveTo(size * 0.9, -size * 0.6);
                ctx.lineTo(size * 1.4, -0.5 * size);
                ctx.lineTo(size * 0.9, -size * 0.3);
                ctx.closePath();
                ctx.fill();
            } else if (obj.type === 'nakki') {
                // Nakkisämpylä (piirretty paremmin, sämpylän värinen pitkylainen)
                ctx.fillStyle = "#ccaa77"; // Sämpylän ruskea
                ctx.beginPath();
                ctx.ellipse(0, 0, size * 1.5, size * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Nakki välissä
                ctx.fillStyle = "#aa5533"; // Nakin ruskea
                ctx.fillRect(-size * 1.2, -size * 0.3, size * 2.4, size * 0.6);
                
                // Sinappiraita
                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-size, -size * 0.1);
                ctx.lineTo(size, -size * 0.1);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawFidgetEnemy(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);
            ctx.rotate(enemy.angle * Math.PI / 180);

            if (enemy.type === 'napit') {
                // ADHD nappisetti
                ctx.fillStyle = "#444455";
                ctx.fillRect(-enemy.size, -enemy.size, enemy.size*2, enemy.size*2);
                for(let i=0; i<4; i++){
                    ctx.fillStyle = Math.random() < 0.5 ? "#ffcc00" : "#ff007f";
                    ctx.beginPath();
                    ctx.arc((i<2?-1:1)*enemy.size*0.5, (i%2==0?-1:1)*enemy.size*0.5, enemy.size*0.3, 0, Math.PI*2);
                    ctx.fill();
                }
            } else if (enemy.type === 'rulla') {
                // ADHD kytkin/rulla
                ctx.fillStyle = "#222233";
                ctx.beginPath();
                ctx.arc(0, 0, enemy.size, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(-enemy.size, -enemy.size*0.3, enemy.size*2, enemy.size*0.6);
            }

            ctx.restore();
        }

        function drawLevelUpChallenge() {
            // Tason noston haasteen piirto
            ctx.save();
            ctx.fillStyle = "rgba(0, 255, 255, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 24px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("TASO LÄPI!", canvas.width / 2, canvas.height / 2 - 120);
            ctx.font = "18px Courier New";
            ctx.fillText("KLIKKAA NOPEASTI KYTKINTÄ!", canvas.width / 2, canvas.height / 2 - 80);

            // Suuri ADHD kytkin
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = "#222233";
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = "#ff007f";
            ctx.beginPath();
            ctx.arc(0, 0, 70, 0, Math.PI*2);
            ctx.fill();

            // Progressio klikkaushaasteessa
            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 40px Courier New";
            ctx.fillText(player.levelUpClicks + " / " + requiredChallengeClicks, 0, 15);

            ctx.restore();
        }

        function drawDuckRescueMinigame() {
            // Ankan pelastus-minipeli - piirretään hidas "raahaus"
            ctx.save();
            ctx.fillStyle = "rgba(0, 255, 255, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 22px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("PELASTA ANKKA!", canvas.width / 2, canvas.height / 2 - 120);
            ctx.font = "16px Courier New";
            ctx.fillText("RAAHAA HIDAASTI JA TASAISESTI!", canvas.width / 2, canvas.height / 2 - 80);

            // Ankanpoikanen minipelissä
            drawObject({type: 'duck'}, minigameDuck.x, minigameDuck.y, 16);

            // Tavoite: Vesijetti
            drawPlayer(canvas.width / 2, canvas.height / 2);

            // Pelastusprogressio
            let minigameProgress = (Date.now() - minigameStartTime) / 1500; // 1.5 sekunnin kesto
            if (minigameProgress > 1) minigameProgress = 1;

            ctx.fillStyle = "#ff007f";
            ctx.fillRect(canvas.width / 2 - 60, canvas.height / 2 + 70, 120, 10);
            ctx.fillStyle = "#00ffff";
            ctx.fillRect(canvas.width / 2 - 60, canvas.height / 2 + 70, 120 * minigameProgress, 10);

            ctx.restore();
        }

        function failMinigame() {
            isDuckRescueMinigameActive = false;
            objects.splice(objects.indexOf(minigameDuck), 1);
            playSound('fidget_crush'); // ADHD klikääni epäonnistumisesta
        }

        function completeMinigame() {
            isDuckRescueMinigameActive = false;
            objects.splice(objects.indexOf(minigameDuck), 1);
            totalRescued++;
            document.getElementById("rescuedVal").innerText = totalRescued;
            updateLevelProgress(25); // Ankka antaa 25 pistettä
            playSound('duck_rescue');
        }

        function startLevelUpChallenge() {
            isLevelUpChallengeActive = true;
            player.levelUpClicks = 0;
            challengeStartTime = Date.now();
        }

        function completeLevelUp() {
            isLevelUpChallengeActive = false;
            currentLevel++;
            document.getElementById("levelVal").innerText = currentLevel;
            levelProgress = 0;
            updateLevelProgressBar();
            playSound('level_up');
        }

        function failLevelUp() {
            isLevelUpChallengeActive = false;
            levelProgress = levelUpThreshold * 0.5; // Menettää 50% edistyksestä
            updateLevelProgressBar();
            playSound('fidget_crush');
        }

        function updateLevelProgress(points) {
            levelProgress += points;
            if (levelProgress > levelUpThreshold) levelProgress = levelUpThreshold;
            updateLevelProgressBar();
            if (levelProgress >= levelUpThreshold && !isLevelUpChallengeActive && !isDuckRescueMinigameActive) {
                startLevelUpChallenge();
            }
        }

        function updateLevelProgressBar() {
            document.getElementById("levelProgressBar").style.width = (levelProgress / levelUpThreshold) * 100 + "%";
        }

        function update() {
            // Minipelit tai haasteet katkaisevat muun päivityksen
            if (isDuckRescueMinigameActive) {
                // Minipelissä ankka raahautuu hitaasti kohti keskustaa
                minigameDuck.x += (canvas.width / 2 - minigameDuck.x) * 0.01;
                minigameDuck.y += (canvas.height / 2 - minigameDuck.y) * 0.01;

                if (Date.now() - minigameStartTime > 1500) {
                    completeMinigame();
                }
                return;
            }

            if (isLevelUpChallengeActive) {
                if (Date.now() - challengeStartTime > 3000) {
                    failLevelUp();
                }
                return;
            }

            // Pelaajan liike
            player.x += (player.targetX - player.x) * player.speed;
            player.y += (player.targetY - player.y) * player.speed;

            if (player.x < 40) player.x = 40;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
            if (player.y < 80) player.y = 80;
            if (player.y > canvas.height - 60) player.y = canvas.height - 60;

            // Vesihiukkaset
            if (Math.random() < 0.6) {
                waterParticles.push({
                    x: (Math.random() * 10) - 5,
                    y: 35,
                    vx: (Math.random() * 2) - 1,
                    vy: Math.random() * 4 + 2,
                    size: Math.random() * 3 + 2,
                    alpha: 1
                });
            }

            for (let i = waterParticles.length - 1; i >= 0; i--) {
                waterParticles[i].y += waterParticles[i].vy;
                waterParticles[i].alpha -= 0.05;
                if (waterParticles[i].alpha <= 0) waterParticles.splice(i, 1);
            }

            // Visuaaliset roiskeet 
            for (let i = splashEffects.length - 1; i >= 0; i--) {
                splashEffects[i].alpha -= 0.03;
                splashEffects[i].size += 1;
                if (splashEffects[i].alpha <= 0) splashEffects.splice(i, 1);
            }

            // Tähdet
            stars.forEach(star => {
                star.z -= 2;
                if (star.z <= 0) {
                    star.z = canvas.width;
                    star.x = Math.random() * canvas.width - canvas.width / 2;
                    star.y = Math.random() * canvas.height - canvas.height / 2;
                }
            });

            // ADHD-Fidget viholliset - liikkuvat kohti pelaajaa (Total Battle -tyyliin)
            for (let i = fidgetEnemies.length - 1; i >= 0; i--) {
                let enemy = fidgetEnemies[i];
