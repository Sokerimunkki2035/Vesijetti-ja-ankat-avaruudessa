<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avaruusvesijetti & Kumiankat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            touch-action: none;
        }
        canvas {
            background-color: #0b0b1e;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffff;
            font-size: 18px;
            text-shadow: 0 0 5px #00ffff;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
         Kyydissä: <span id="towingVal">0</span>/5<br>
         Pelastettu: <span id="rescuedVal">0</span><br>
         Erikoisesineet: <span id="specialVal">0</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Ääniefektit Web Audio API:lla (ei vaadi ulkoisia tiedostoja)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'duck') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'makkara') { // Suomalainen makkara-ääni
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'home') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        let rescuedScore = 0;
        let specialScore = 0;
        let towedDucks = [];
        const maxTowed = 5;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            targetX: canvas.width / 2,
            targetY: canvas.height - 150,
            speed: 0.15,
            history: []
        };

        const objects = []; // Sisältää ankat, makkarat ja takoyakit
        const stars = [];
        const waterParticles = [];
        const splashEffects = []; // Visuaaliset tehosteet (sinappiroiskeet yms.)

        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width - canvas.width / 2,
                y: Math.random() * canvas.height - canvas.height / 2,
                z: Math.random() * canvas.width,
                size: Math.random() * 2 + 1
            });
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.touches[0].clientX - rect.left;
            player.targetY = e.touches[0].clientY - rect.top;
        }

        window.addEventListener("touchmove", handleTouch, { passive: false });
        window.addEventListener("touchstart", handleTouch, { passive: false });
        window.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        // Spawnataan ankoja, makkaroita ja takoyakeja
        function spawnObjects() {
            if (objects.length < 5 && Math.random() < 0.03) {
                let rand = Math.random();
                let type = 'duck';
                if (rand > 0.7) type = 'makkara'; // Suomalainen makkara
                else if (rand > 0.5) type = 'takoyaki'; // Japanilainen pallo

                objects.push({
                    type: type,
                    x: (Math.random() - 0.5) * canvas.width * 0.7,
                    y: (Math.random() - 0.5) * canvas.height * 0.4,
                    z: canvas.width,
                    size: type === 'duck' ? 22 : 18,
                    angle: Math.random() * 360,
                    spin: Math.random() * 3 - 1.5
                });
            }
        }

        function drawHomeBase() {
            ctx.save();
            ctx.fillStyle = "rgba(0, 255, 255, 0.15)";
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 0, 100, 0, Math.PI);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#00ffff";
            ctx.font = "14px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("TURVASATAMA", canvas.width / 2, 35);
            ctx.fillText("(Tuo ankat tänne)", canvas.width / 2, 55);
            ctx.restore();
        }

        function drawPlayer(x, y) {
            ctx.save();
            ctx.translate(x, y);

            waterParticles.forEach(p => {
                ctx.fillStyle = `rgba(0, 220, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vesijetin runko
            ctx.fillStyle = "#ff007f";
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.bezierCurveTo(20, -10, 22, 25, 15, 35);
            ctx.lineTo(-15, 35);
            ctx.bezierCurveTo(-22, 25, -20, -10, 0, -35);
            ctx.closePath();
            ctx.fill();

            // Penkki & ohjaustanko
            ctx.fillStyle = "#111122";
            ctx.beginPath();
            ctx.ellipse(0, 5, 8, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-12, -10);
            ctx.lineTo(12, -10);
            ctx.stroke();

            ctx.restore();
        }

        function drawObject(obj, x, y, size) {
            if (size <= 0) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(obj.angle * Math.PI / 180);

            if (obj.type === 'duck') {
                // Ankka
                ctx.fillStyle = "#ffcc00";
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff5500";
                ctx.beginPath();
                ctx.moveTo(size * 0.9, -size * 0.6);
                ctx.lineTo(size * 1.4, -0.5 * size);
                ctx.lineTo(size * 0.9, -size * 0.3);
                ctx.closePath();
                ctx.fill();
            } else if (obj.type === 'makkara') {
                // Suomalainen grillimakkara (ruskehtava pötkö foliolla)
                ctx.fillStyle = "#cc5500";
                ctx.beginPath();
                ctx.ellipse(0, 0, size * 1.2, size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                // Sinappiraita päällä
                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-size, 0);
                ctx.lineTo(size, 0);
                ctx.stroke();
            } else if (obj.type === 'takoyaki') {
                // Japanilainen takoyaki-pallo (punertava erikoispallo)
                ctx.fillStyle = "#ff3366";
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-size * 0.3, -size * 0.3, size * 0.6, size * 0.6);
            }

            ctx.restore();
        }

        function update() {
            player.x += (player.targetX - player.x) * player.speed;
            player.y += (player.targetY - player.y) * player.speed;

            if (player.x < 40) player.x = 40;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
            if (player.y < 80) player.y = 80;
            if (player.y > canvas.height - 60) player.y = canvas.height - 60;

            player.history.unshift({ x: player.x, y: player.y });
            if (player.history.length > 100) player.history.pop();

            // Vesihiukkaset
            if (Math.random() < 0.6) {
                waterParticles.push({
                    x: (Math.random() * 10) - 5,
                    y: 35,
                    vx: (Math.random() * 2) - 1,
                    vy: Math.random() * 4 + 2,
                    size: Math.random() * 3 + 2,
                    alpha: 1
                });
            }

            for (let i = waterParticles.length - 1; i >= 0; i--) {
                waterParticles[i].y += waterParticles[i].vy;
                waterParticles[i].alpha -= 0.05;
                if (waterParticles[i].alpha <= 0) waterParticles.splice(i, 1);
            }

            // Visuaaliset roiskeet (esim. sinappiefektit)
            for (let i = splashEffects.length - 1; i >= 0; i--) {
                splashEffects[i].alpha -= 0.03;
                splashEffects[i].size += 1;
                if (splashEffects[i].alpha <= 0) splashEffects.splice(i, 1);
            }

            // Tähdet
            stars.forEach(star => {
                star.z -= 2;
                if (star.z <= 0) {
                    star.z = canvas.width;
                    star.x = Math.random() * canvas.width - canvas.width / 2;
                    star.y = Math.random() * canvas.height - canvas.height / 2;
                }
            });

            // Objektit
            spawnObjects();
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.z -= 1.8;
                obj.angle += obj.spin;

                if (obj.z <= 0) {
                    objects.splice(i, 1);
                    continue;
                }

                let k = 400 / obj.z;
                let screenX = obj.x * k + canvas.width / 2;
                let screenY = obj.y * k + canvas.height / 2;
                let currentSize = obj.size * k;

                let dist = Math.hypot(screenX - player.x, screenY - player.y);
                
                if (obj.z < 120 && dist < currentSize + 30) {
                    if (obj.type === 'duck') {
                        if (towedDucks.length < maxTowed) {
                            towedDucks.push({ size: 16 });
                            document.getElementById("towingVal").innerText = towedDucks.length;
                            playSound('duck');
                            objects.splice(i, 1);
                        }
                    } else if (obj.type === 'makkara') {
                        // Suomalainen makkaraefekti
                        specialScore += 5;
                        document.getElementById("specialVal").innerText = specialScore;
                        playSound('makkara');
                        splashEffects.push({ x: screenX, y: screenY, text: "SINAPPIA!", alpha: 1, size: 15, color: "#ffcc00" });
                        objects.splice(i, 1);
                    } else if (obj.type === 'takoyaki') {
                        // Japanilainen erikoispallo
                        specialScore += 10;
                        document.getElementById("specialVal").innerText = specialScore;
                        playSound('home');
                        splashEffects.push({ x: screenX, y: screenY, text: "TAKOYAKI!", alpha: 1, size: 15, color: "#ff3366" });
                        objects.splice(i, 1);
                    }
                }
            }

            // Kotisatama
            let distToHome = Math.hypot(player.x - canvas.width / 2, player.y - 0);
            if (distToHome < 110 && towedDucks.length > 0) {
                rescuedScore += towedDucks.length;
                towedDucks = [];
                document.getElementById("towingVal").innerText = 0;
                document.getElementById("rescuedVal").innerText = rescuedScore;
                playSound('home');
            }
        }

        function draw() {
            ctx.fillStyle = "#07071c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tähdet
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                let k = 300 / star.z;
                let px = star.x * k + canvas.width / 2;
                let py = star.y * k + canvas.height / 2;
                let s = star.size * k;
                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    ctx.fillRect(px, py, s, s);
                }
            });

            drawHomeBase();

            // Kohteet
            objects.forEach(obj => {
                let k = 400 / obj.z;
                let screenX = obj.x * k + canvas.width / 2;
                let screenY = obj.y * k + canvas.height / 2;
                let currentSize = obj.size * k;
                drawObject(obj, screenX, screenY, currentSize);
            });

            // Ankkajono perässä
            towedDucks.forEach((duck, index) => {
                let historyIndex = (index + 1) * 12;
                if (player.history[historyIndex]) {
                    let pos = player.history[historyIndex];
                    ctx.strokeStyle = "rgba(0, 255, 255, 0.4)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    let prevPos = index === 0 ? player : player.history[index * 12];
                    ctx.moveTo(prevPos.x, prevPos.y);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();

                    drawObject({type: 'duck'}, pos.x, pos.y, duck.size);
                }
            });

            drawPlayer(player.x, player.y);

            // Piirretään visuaaliset teksti-efektit (sinappiroiskeet yms.)
            splashEffects.forEach(effect => {
                ctx.save();
                ctx.globalAlpha = effect.alpha;
                ctx.fillStyle = effect.color;
                ctx.font = "bold 20px Courier New";
                ctx.textAlign = "center";
                ctx.fillText(effect.text, effect.x, effect.y);
                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
