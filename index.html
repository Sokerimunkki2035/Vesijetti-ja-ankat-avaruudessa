<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avaruusvesijetti & Kumiankat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
        }
        canvas {
            background-color: #0b0b1e;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            max-width: 100%;
            max-height: 100%;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 20px;
            text-shadow: 0 0 5px #00ffff;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Ankat: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Asetetaan canvas sopimaan ruudulle
        function resizeCanvas() {
            canvas.width = window.innerWidth < 600 ? window.innerWidth - 20 : 600;
            canvas.height = window.innerHeight < 800 ? window.innerHeight - 40 : 800;
        }
        resizeCanvas();

        let score = 0;
        const scoreVal = document.getElementById("scoreVal");

        // Pelaaja (Vesijetti pysyy alhaalla keskellä, mutta kallistuu/liikkuu sormen mukaan)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            targetX: canvas.width / 2,
            targetY: canvas.height - 120,
            width: 70,
            height: 40,
            speed: 0.15 // Pehmeä seuranta
        };

        const ducks = [];
        const stars = [];
        const waterParticles = [];

        // Luodaan 3D-tähdet (tulevat syvyydestä kohti)
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width - canvas.width / 2,
                y: Math.random() * canvas.height - canvas.height / 2,
                z: Math.random() * canvas.width,
                size: Math.random() * 2 + 1
            });
        }

        // Ohjaus puhelimella (kosketus) ja hiirellä
        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            player.targetX = clientX - rect.left;
            player.targetY = clientY - rect.top;
        }

        window.addEventListener("mousemove", handleMove);
        window.addEventListener("touchmove", handleMove, { passive: false });
        window.addEventListener("touchstart", handleMove, { passive: false });

        function spawnDuck() {
            if (ducks.length < 5 && Math.random() < 0.03) {
                ducks.push({
                    x: Math.random() * canvas.width - canvas.width / 2,
                    y: Math.random() * canvas.height - canvas.height / 2,
                    z: canvas.width, // Alkaa kaukaisuudesta
                    size: 10,
                    angle: Math.random() * 360,
                    spin: Math.random() * 4 - 2
                });
            }
        }

        function drawPlayer(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Vesisuihku takaa (efekti avaruusmoottorista)
            waterParticles.forEach(p => {
                ctx.fillStyle = `rgba(0, 220, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vesijetin runko (katsottuna hieman takaviistosta/ylhäältä)
            ctx.fillStyle = "#ff00ff"; // Neon magenta
            ctx.beginPath();
            ctx.moveTo(0, -20);  // Keula
            ctx.lineTo(25, 20);  // Oikea perä
            ctx.lineTo(-25, 20); // Vasen perä
            ctx.closePath();
            ctx.fill();

            // Istuin ja paneeli
            ctx.fillStyle = "#00ffff";
            ctx.fillRect(-8, -5, 16, 15);

            ctx.restore();
        }

        function drawDuck(duck, screenX, screenY, size) {
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(duck.angle * Math.PI / 180);

            // Vartalo suhteutettuna etäisyyteen
            ctx.fillStyle = "#ffff00";
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();

            // Pää
            ctx.beginPath();
            ctx.arc(size * 0.5, -size * 0.7, size * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Nokka
            ctx.fillStyle = "#ff6600";
            ctx.beginPath();
            ctx.moveTo(size * 0.9, -size * 0.8);
            ctx.lineTo(size * 1.4, -size * 0.7);
            ctx.lineTo(size * 0.9, -size * 0.5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function update() {
            // Smooth liike kohti sormea/hiirtä
            player.x += (player.targetX - player.x) * player.speed;
            player.y += (player.targetY - player.y) * player.speed;

            // Rajoitetaan pelialueelle
            if (player.x < 40) player.x = 40;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;
            if (player.y < 100) player.y = 100;
            if (player.y > canvas.height - 40) player.y = canvas.height - 40;

            // Luodaan vesisuihkupaketteja
            if (Math.random() < 0.6) {
                waterParticles.push({
                    x: (Math.random() * 16) - 8,
                    y: 25,
                    vx: (Math.random() * 2) - 1,
                    vy: Math.random() * 4 + 3,
                    size: Math.random() * 4 + 2,
                    alpha: 1
                });
            }

            // Päivitetään vesisuihku
            for (let i = waterParticles.length - 1; i >= 0; i--) {
                waterParticles[i].x += waterParticles[i].vx;
                waterParticles[i].y += waterParticles[i].vy;
                waterParticles[i].alpha -= 0.04;
                if (waterParticles[i].alpha <= 0) waterParticles.splice(i, 1);
            }

            // Päivitetään 3D-tähdet lentämään kohti
            stars.forEach(star => {
                star.z -= 4; // Liikkuu lähemmäs katsojaa
                if (star.z <= 0) {
                    star.z = canvas.width;
                    star.x = Math.random() * canvas.width - canvas.width / 2;
                    star.y = Math.random() * canvas.height - canvas.height / 2;
                }
            });

            // Päivitetään avaruusankat
            spawnDuck();
            for (let i = ducks.length - 1; i >= 0; i--) {
                let d = ducks[i];
                d.z -= 3; // Ankka lentää lähemmäs
                d.angle += d.spin;

                // Lasketaan 3D-projektio ruudulle
                let k = 400 / d.z;
                let screenX = d.x * k + canvas.width / 2;
                let screenY = d.y * k + canvas.height / 2;
                let currentSize = d.size * k;

                // Jos ankka ohittaa pelaajan
                if (d.z <= 0) {
                    ducks.splice(i, 1);
                    continue;
                }

                // Törmäyksentunnistus (nappaus), kun ankka on samalla syvyydellä kuin pelaaja
                if (d.z < 150 && d.z > 50) {
                    let dist = Math.hypot(screenX - player.x, screenY - player.y);
                    if (dist < currentSize + 30) {
                        score++;
                        scoreVal.innerText = score;
                        ducks.splice(i, 1);
                        continue;
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#07071c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Piirretään 3D-tähdet
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                let k = 300 / star.z;
                let px = star.x * k + canvas.width / 2;
                let py = star.y * k + canvas.height / 2;
                let s = star.size * k;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    ctx.fillRect(px, py, s, s);
                }
            });

            // Piirretään ankat, jotka ovat kauempana kuin pelaaja
            ducks.forEach(d => {
                let k = 400 / d.z;
                let screenX = d.x * k + canvas.width / 2;
                let screenY = d.y * k + canvas.height / 2;
                let currentSize = d.size * k;
                
                if (d.z >= 100) {
                    drawDuck(d, screenX, screenY, currentSize);
                }
            });

            // Piirretään pelaaja
            drawPlayer(player.x, player.y);

            // Piirretään ankat, jotka ovat jo aivan pelaajan "iholla" tai menneet ohi
            ducks.forEach(d => {
                let k = 400 / d.z;
                let screenX = d.x * k + canvas.width / 2;
                let screenY = d.y * k + canvas.height / 2;
                let currentSize = d.size * k;
                
                if (d.z < 100) {
                    drawDuck(d, screenX, screenY, currentSize);
                }
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
